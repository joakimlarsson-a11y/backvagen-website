backend:
  name: github
  repo: duff92/backvagen-website
  branch: main
  # Custom OAuth proxy endpoint hosted in our own Astro API.
  base_url: https://asabackvag.se
  auth_endpoint: api/cms-auth/auth

# Point Decap at the local dev server when using `npx decap-server`
# on localhost. Comment out the `local_backend` block when working against GitHub.
local_backend: true

publish_mode: simple
media_folder: public/images
public_folder: /images
site_url: https://asabackvag.se
display_url: https://asabackvag.se
locale: sv

collections:
  - name: vad-ingar
    label: 'Vad ingår i området'
    label_singular: 'Undersida'
    description: 'Sidor som listar vad som ingår med en tomt i samfälligheten (kvartersstugan, garage, verktyg, grönytor).'
    folder: src/content/vad-ingar
    create: true
    slug: '{{slug}}'
    format: frontmatter
    extension: md
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: kicker, label: 'Överrubrik (liten)', widget: string, required: false }
      - { name: lede, label: 'Ingress (kort)', widget: text }
      - {
          name: order,
          label: 'Sorteringsordning',
          widget: number,
          value_type: int,
          min: 1,
          hint: '1 = först i listan',
        }
      - {
          name: heroImage,
          label: 'Huvudbild',
          widget: image,
          required: false,
          hint: 'Visas överst på sidan. Lämna tom för att använda en gradient-placeholder.',
        }
      - {
          name: heroImageAlt,
          label: 'Bildbeskrivning (alt-text)',
          widget: string,
          required: false,
          hint: 'Beskriv vad som syns på bilden — viktigt för tillgänglighet.',
        }
      - {
          name: heroImageCaption,
          label: 'Bildtext',
          widget: string,
          required: false,
        }
      - name: sidebar
        label: 'Snabbfakta (sidobar)'
        widget: list
        required: false
        summary: '{{fields.label}}: {{fields.value}}'
        fields:
          - { name: label, label: Etikett, widget: string }
          - { name: value, label: Värde, widget: string }
      - { name: body, label: 'Brödtext', widget: markdown }

  - name: faq
    label: 'Frågor & svar (inloggat)'
    label_singular: 'Fråga'
    description: 'FAQ-artiklar som visas i medlemsområdet. Grupperas efter kategori.'
    folder: src/content/faq
    create: true
    slug: '{{slug}}'
    format: frontmatter
    extension: md
    fields:
      - { name: question, label: Fråga, widget: string }
      - {
          name: category,
          label: Kategori,
          widget: select,
          options:
            [
              'Sophantering',
              'Skötsel & underhåll',
              'Vatten & ledningar',
              'Nätverk & el',
              'Styrelse & stämma',
              'Övrigt',
            ],
        }
      - {
          name: order,
          label: 'Sorteringsordning',
          widget: number,
          value_type: int,
          min: 1,
        }
      - { name: body, label: Svar, widget: markdown }

  - name: dokument-publika
    label: 'Publika dokument'
    label_singular: 'Dokument'
    description: 'Dokument som är tillgängliga för alla — t.ex. stadgar och anläggningsbeslut.'
    folder: src/content/dokument-publika
    create: true
    slug: '{{slug}}'
    format: frontmatter
    extension: md
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: description, label: Beskrivning, widget: text, required: false }
      - {
          name: date,
          label: Datum,
          widget: date,
          format: 'YYYY-MM-DD',
          required: false,
        }
      - { name: category, label: Kategori, widget: string, required: false }
      - {
          name: file,
          label: 'PDF-fil',
          widget: file,
          media_folder: '/public/pdf',
          public_folder: '/pdf',
          required: false,
        }
      - { name: body, label: 'Sammanfattning', widget: markdown, required: false }

  - name: dokument-medlem
    label: 'Medlemsdokument'
    label_singular: 'Dokument'
    description: 'Dokument som endast syns för inloggade medlemmar — informationsbrev, protokoll, underhållsplan.'
    folder: src/content/dokument-medlem
    create: true
    slug: '{{slug}}'
    format: frontmatter
    extension: md
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: description, label: Beskrivning, widget: text, required: false }
      - {
          name: date,
          label: Datum,
          widget: date,
          format: 'YYYY-MM-DD',
          required: false,
        }
      - { name: category, label: Kategori, widget: string, required: false }
      - {
          name: file,
          label: 'PDF-fil',
          widget: file,
          media_folder: '/public/pdf',
          public_folder: '/pdf',
          required: false,
        }
      - { name: body, label: 'Sammanfattning', widget: markdown, required: false }
