name = "backvagen-website"
main = "./dist/_worker.js/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Serve the prerendered pages and client assets straight from Cloudflare's
# edge — the Worker only handles SSR for /medlem, /admin and /api routes.
[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

# KV namespace for app data (allowed users, magic links, sessions, login log).
# Create in production with:
#   npx wrangler kv namespace create APP_KV
#   npx wrangler kv namespace create APP_KV --preview
# Then fill in the ids below.
[[kv_namespaces]]
binding = "APP_KV"
id = "3ff5e78d9e9449d99c332ecd2b843d6f"
preview_id = "6c5c273651cf4625887f0bd76610d0d3"

# Public env-vars. Secrets (HASH_SECRET, RESEND_API_KEY, GITHUB_CLIENT_SECRET)
# must be set via:
#   npx wrangler secret put HASH_SECRET
[vars]
PUBLIC_SITE_URL = "https://asabackvag.se"
# Tillfällig sandbox-avsändare tills asabackvag.se är verifierad i Resend.
# När domänen är verifierad: byt till "Bäckvägens Samfällighet <no-reply@asabackvag.se>".
EMAIL_FROM = "Bäckvägens Samfällighet <onboarding@resend.dev>"
